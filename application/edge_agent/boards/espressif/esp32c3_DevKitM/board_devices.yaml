version: 1.0.0
# Devices Configuration for ESP32-C3-DevKitM-1
#
# The ESP32-C3-DevKitM-1 has a single WS2812 RGB LED on GPIO 8.
# It is driven via the RMT peripheral (C3 has one RMT channel).

devices:
  - name: led_strip
    chip: ws2812
    type: custom
    version: default
    init_skip: true
    dependencies:
      espressif/led_strip:
        version: "^3.0"
        public: true
    config:
      max_leds: 1                  # Single onboard RGB LED
    peripherals:
      - name: rmt_tx               # RMT TX peripheral used by the LED strip
